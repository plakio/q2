name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      - name: Verify and build package
        run: |
          npm run check
          npm run build

      - name: Verify tag and plugin versions match
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $VERSION" q2.php
          test -f "dist/q2-$VERSION.zip"
          test -s "scripts/release-notes/$VERSION.md"
          cp "dist/q2-$VERSION.zip" dist/q2.zip
          ( cd dist && shasum -a 256 q2.zip > q2.zip.sha256 )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="scripts/release-notes/$VERSION.md"
          test -s "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" \
            "dist/q2.zip" \
            "dist/q2.zip.sha256" \
            "dist/q2-$VERSION.zip" \
            "dist/q2-$VERSION.zip.sha256" \
            --title "Q2 $VERSION" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
